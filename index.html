
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Todo Application</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>My Todo List</h1>
            <p>Organize your day and achieve your goals!</p>
        </header>

        <!-- Add Task Section -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button id="addBtn">Add Task</button>

        </div>

        <!-- Task Statistics -->
        <div class="stats">

            <div class="stat-box">
                <h2 id="totalTasks">0</h2>
                <p>Total Tasks</p>
            </div>

            <div class="stat-box">
                <h2 id="completedTasks">0</h2>
                <p>Completed</p>
            </div>

            <div class="stat-box">
                <h2 id="pendingTasks">0</h2>
                <p>Pending</p>
            </div>

        </div>

        <!-- Search Section -->
        <div class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
            >

        </div>

        <!-- Filter Section -->
        <div class="filter-section">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="pending">
                Pending
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>

        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Clear Completed Tasks -->
        <button id="clearBtn" class="clear-btn">
            Clear Completed Tasks
        </button>

        <!-- Footer -->
        <footer>
            <p>Designed by: Tharunish Vasan T</p>
            <p>Register Number: 212224240174</p>
        </footer>

    </div>

    <!-- Connect JavaScript -->
    <script src="./script.js"></script>

</body>

</html>
